services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adam}
      POSTGRES_USER: ${POSTGRES_USER:-adam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adam} -d ${POSTGRES_DB:-adam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Adam: "Host=db;Port=5432;Database=${POSTGRES_DB:-adam};Username=${POSTGRES_USER:-adam};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      DataProtection__KeysDirectory: /app/keys
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - keys:/app/keys
      - media:/app/wwwroot/media

volumes:
  pgdata:
  keys:
  media:
